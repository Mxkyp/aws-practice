name: Start AWS emulator
description: Install aws-emulator, start it in the background, and point the AWS CLI/SDKs at it.
runs:
  using: composite
  steps:
    - name: Install aws-emulator
      shell: bash
      run: |
        curl -fsSLo /tmp/aws-emulator.deb https://downloads.aws.com/aws-emulator/packages/aws-emulator/LTS/latest/aws-emulator_amd64.deb
        sudo apt-get install -y /tmp/aws-emulator.deb

    - name: Start aws-emulator in the background
      shell: bash
      run: nohup aws-emulator --telemetry off --idle-timeout 900 > /tmp/aws-emulator.log 2>&1 &

    # --insecure only for this health check: ca.pem may not exist yet on the
    # first tries. Real AWS CLI calls verify TLS via ca_bundle in the config.
    - name: Wait until healthy (up to 60s)
      shell: bash
      run: curl --silent --fail --insecure --retry 60 --retry-delay 1 --retry-all-errors https://127.0.0.1:9297/__admin/health

    - name: Point the AWS CLI at the emulator
      shell: bash
      run: |
        echo "AWS_CONFIG_FILE=$HOME/.aws/emulator/9297/config" >> "$GITHUB_ENV"
        echo "AWS_SHARED_CREDENTIALS_FILE=$HOME/.aws/emulator/9297/emulator_credentials" >> "$GITHUB_ENV"

    - name: Show emulator log
      if: failure()
      shell: bash
      run: cat /tmp/aws-emulator.log
