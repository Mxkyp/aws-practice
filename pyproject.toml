[project]
name = "aws-practice"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mxkyp", email = "157213409+Mxkyp@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aws-lambda-powertools>=3.41.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "poethepoet>=0.49.0",
    "pytest>=9.2.0",
]

[tool.poe.env]
PYTHONPATH.default = "lib"
AWS_CONFIG_FILE.default = "${HOME}/.aws/emulator/9297/config"
AWS_SHARED_CREDENTIALS_FILE.default = "${HOME}/.aws/emulator/9297/emulator_credentials"

[tool.poe.tasks]
infra-init = "terraform -chdir=infra init -input=false"
infra-apply = "terraform -chdir=infra apply -auto-approve -input=false"
infra.sequence = ["infra-init", "infra-apply"]
infra.help = "Infra pipeline: function shells, roles, bucket, table"

deploy.cmd = "scripts/deploy_code.sh get_show"
deploy.help = "Code pipeline: build, upload and deploy function code"

seed.shell = """
for f in scripts/seed/*.json; do
  left=$(aws dynamodb batch-write-item --request-items "file://$f" \
    --query 'length(keys(UnprocessedItems))' --output text)
  [ "$left" = 0 ] || { echo "$f: unprocessed items left" >&2; exit 1; }
done
echo "seeded $(ls scripts/seed/*.json | wc -l) batches"
"""
seed.help = "Load the committed seed batches (scripts/seed/*.json, <=25 puts each) into the table"

test-api.shell = """
API_URL=$(terraform -chdir=infra output -raw api_invoke_url) pytest tests/api
"""
test-api.help = "HTTP tests of the deployed API against the seed data (needs infra, deploy, seed)"

e2e.sequence = ["infra", "deploy", "seed", "test-api"]
e2e.help = "Apply infra, deploy code, seed data and run the API tests against the emulator"
