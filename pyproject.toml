[project]
name = "aws-practice"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mxkyp", email = "157213409+Mxkyp@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "poethepoet>=0.49.0",
]

[tool.poe.env]
AWS_CONFIG_FILE.default = "${HOME}/.aws/emulator/9297/config"
AWS_SHARED_CREDENTIALS_FILE.default = "${HOME}/.aws/emulator/9297/emulator_credentials"

[tool.poe.tasks]
infra-init = "terraform -chdir=infra init -input=false"
infra-apply = "terraform -chdir=infra apply -auto-approve -input=false"
infra.sequence = ["infra-init", "infra-apply"]
infra.help = "Infra pipeline: function shells, roles, bucket, table"

deploy.cmd = "scripts/deploy_code.sh get_show"
deploy.help = "Code pipeline: build, upload and deploy function code"

seed.cmd = """
aws dynamodb put-item --table-name show --item
  '{"pk": {"S": "firefly"}, "sk": {"S": "META"}, "name": {"S": "Firefly"}, "premiered": {"S": "2002-09-20"}}'
"""
seed.help = "Write one known show (firefly) to the table"

smoke.shell = """
mkdir -p build
aws lambda invoke --function-name get_show \
  --cli-binary-format raw-in-base64-out --payload '{"show": "firefly"}' \
  build/smoke.json > /dev/null
echo "get_show -> $(cat build/smoke.json)"
jq -e '.statusCode == 200' build/smoke.json > /dev/null
"""
smoke.help = "Fail unless get_show returns the seeded show with status 200"

e2e.sequence = ["infra", "deploy", "seed", "smoke"]
e2e.help = "Apply infra, deploy code, seed data and smoke-test against the emulator"
